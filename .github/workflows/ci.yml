name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
        env:
          NODE_OPTIONS: --experimental-vm-modules
      - run: npm run build
      - run: npm run lint
