name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture dependency audit report
        if: always()
        run: npm audit --json > npm-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-npm-audit
          path: npm-audit.json
          if-no-files-found: ignore
      - run: npm test -- --runInBand
        env:
          NODE_OPTIONS: --experimental-vm-modules
      - run: npm run build
      - name: Format changed TypeScript sources before lint
        run: npx prettier --write scripts/rotate-encryption-keys.ts src/common/key-rotation.ts src/common/key-rotation.spec.ts src/config/production-readiness.ts src/config/production-readiness.spec.ts src/main.ts src/transactions/transactions.service.ts src/transactions/paystack-webhook.controller.ts src/transactions/paystack-signature.ts src/transactions/paystack-signature.spec.ts src/transactions/paystack-webhook.controller.spec.ts src/transactions/transactions.service.spec.ts src/transactions/transactions.service.payBill-redemption.spec.ts test/mocks/nest-schedule.ts
      - run: npm run lint
