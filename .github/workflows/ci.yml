name: Backend hotfix CI

on:
  push:
    branches: ['hotfix/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npx prettier --write src/main.ts src/transactions/paystack-signature.spec.ts src/transactions/paystack-signature.ts src/transactions/paystack-webhook.controller.ts src/transactions/transactions.service.spec.ts src/transactions/transactions.service.ts test/mocks/nest-schedule.ts
      - run: npm run lint
